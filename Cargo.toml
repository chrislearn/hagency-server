[workspace]
members = ["crates/*"]
default-members = ["crates/backend"]
exclude = ["xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/chrislearn/hagency-server"
publish = false

[workspace.dependencies]
# Palpo embedding API; pin until the upstream PR is merged.
palpo = { git = "https://github.com/palpo-im/palpo.git", rev = "c8568d9844a6be0a3172d98d7c9810e3a1f7521c" }
pasion-backend = { git = "https://github.com/meldry-com/pasion.git", rev = "03cd9f94c0c0593c3979de68a0b11ee443f23933", features = ["cedar"] }
pasion-config = { git = "https://github.com/meldry-com/pasion.git", rev = "03cd9f94c0c0593c3979de68a0b11ee443f23933" }
figment = "0.10"
camino = "1"
rand_chacha = "0.3"
rand_core = "0.6"
tracing-opentelemetry = { version = "0.33", default-features = false }
opentelemetry = { version = "0.32", features = ["trace"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
salvo = { version = "1.0.0", features = ["serve-static", "test"] }
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1.1", features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["json"] }
diesel = { version = "2.3", features = ["postgres", "serde_json"] }
diesel-async = { version = "0.9", features = ["postgres"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
sha2 = "0.11"
base64 = "0.23"
regex = "1"
subtle = "2"
aes-gcm = "0.10"
hex = "0.4"
unicode-normalization = "0.1"

percent-encoding = "2.3"
tempfile = "3"

[profile.release.package.palpo]
opt-level = 1
codegen-units = 256

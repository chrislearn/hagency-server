[package]
name = "hagency-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# Keep tooling dependency resolution/builds independent of the large server.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
libc = "0.2"
percent-encoding = "2"
rand = "0.10"
serde_json = "1"
sha2 = "0.11"
signal-hook = "0.3"
tar = "0.4"
tempfile = "3"
toml = "1.1"

[dev-dependencies]
url = "2"

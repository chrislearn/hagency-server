[package]
name = "hagency-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
getrandom = "=0.3.4"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
thiserror = "=2.0.18"

[dev-dependencies]
tempfile = "=3.24.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

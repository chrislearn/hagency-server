[package]
name = "hagency-frontend"
version.workspace = true
authors = ["Meldry Team", "Hagency contributors"]
license.workspace = true
rust-version.workspace = true
edition.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["web", "router"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde-saphyr.workspace = true
gloo-net = { workspace = true, features = ["http", "json"] }
gloo-storage.workspace = true
gloo-timers = { workspace = true, features = ["futures"] }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "HtmlDocument",
    "HtmlElement",
    "HtmlAnchorElement",
    "Location",
    "Storage",
    "MediaQueryList",
    "Url",
    "UrlSearchParams",
    "Headers",
    "RequestInit",
    "Request",
    "Response",
    "RequestCredentials",
    "RequestMode",
    "DomTokenList",
    "Element",
    "Navigator",
    "Clipboard",
    "Blob",
    "BlobPropertyBag",
    "Crypto",
    "SubtleCrypto",
    "EventTarget",
    "Event",
] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
chrono = { workspace = true, features = ["serde", "wasmbind"] }
urlencoding.workspace = true
log.workspace = true
dioxus-logger.workspace = true
regex-lite.workspace = true
futures.workspace = true
